name: Deploy arcade (dev site)

# Builds the arcade (site/ menu + every game in games/, see scripts/build-site.sh) and
# publishes it to Azure Static Web Apps. Games in games/<name>/ are served at /<name>/.
# This is the DEV / test site (the azurestaticapps.net address, with a DEV ribbon). Pull requests
# get their own temporary preview URL; pushes to main update the dev site. The real arcade at
# nzdogames.com is deployed from the `production` branch by deploy-production.yml.
# Requires repo secret AZURE_STATIC_WEB_APPS_API_TOKEN (see README.md).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

jobs:
  check_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    # One deploy at a time per target. Pushes to main queue up (the newest one includes every
    # earlier change), so Azure never cancels an overlapping upload. A new push to a PR replaces
    # that PR's in-progress preview build.
    concurrency:
      group: deploy-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build menu and games
        run: scripts/build-site.sh
        env:
          ARCADE_ENV: dev
      - name: Deploy
        # Skipped until the Azure token secret is configured.
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: _deploy
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    # Same group as the PR's preview build: closing cancels a preview still uploading, so it
    # can't finish after the close and leave a stray environment taking one of the free slots.
    concurrency:
      group: deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Close preview environment
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
